title: "Zahra Mohajeri · Golden Glyph"
name_en: Zahra Mohajeri
name_fa: زهرا مهاجری
title_fa: زرنوشت
author: Zahra Mohajeri
description: "Zahra Mohajeri (زهرا مهاجری) — Iranian writer and journalist. Short stories, essays, reports and reviews in English and Persian."
logo: /assets/img/zahra-mohajeri.jpg
social:
  name: Zahra Mohajeri
  links:
    - https://t.me/zar_neveshtt
    - https://zmohajeri.wixsite.com/zmohajeri
url: "https://zmohajeri.github.io"
baseurl: ""
permalink: /:categories/:year/:month/:title/
timezone: America/Toronto
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
collections:
  rooznevesht:
    output: true
    permalink: /fa/rooznevesht/:year/:month/:day/:title/
  notebook:
    output: true
    permalink: /en/librarians-notebook/:year/:month/:day/:title/
  ketab:
    output: true
    permalink: /fa/chaharshanbe-ha-ba-ketab/:year/:month/:day/:title/
  boresh:
    output: true
    permalink: /fa/boreshi-az-dastan/:year/:month/:day/:title/
defaults:
  - scope: { path: "google1c0a51237369fd2f.html" }
    values: { sitemap: false }
  - scope: { path: "" }
    values: { image: /assets/img/zahra-mohajeri.jpg }
  - scope: { path: "", type: "boresh" }
    values: { lang: fa, layout: story }
  - scope: { path: "", type: "notebook" }
    values: { lang: en, layout: post, kicker: "The Librarian's Notebook", topic: "The Librarian's Notebook" }
  - scope: { path: "", type: "ketab" }
    values: { lang: fa, layout: book }
  - scope: { path: "", type: "rooznevesht" }
    values: { lang: fa, layout: entry }
  - scope: { path: "en" }
    values: { lang: en }
  - scope: { path: "fa" }
    values: { lang: fa }
