title: Golden Glyph
title_fa: زرنوشت
author: Zahra Mohajeri
description: Essays, reviews and stories by Zahra Mohajeri.
url: "https://zmohajeri.github.io"
baseurl: ""
permalink: /:categories/:year/:month/:title/
timezone: America/Toronto
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
collections:
  rooznevesht:
    output: true
    permalink: /fa/rooznevesht/:year/:month/:day/:title/
defaults:
  - scope: { path: "", type: "rooznevesht" }
    values: { lang: fa, layout: entry }
  - scope: { path: "en" }
    values: { lang: en }
  - scope: { path: "fa" }
    values: { lang: fa }
