back_cover: |
  آنا از مغازه پرید بیرون. نگاهش به هر طرف دوید. دلش چنگ شد.
  «یه دختر کوچیک، ژاکت صورتی تنش بود، موهاش کوتاه... کسی ندیده؟»
  نگهبان گفت: «نگران نباشین، اگه بیرون نرفته باشه، پیدا می‌شه.»
  اما آنا دلش گواهی بدی می‌داد. خم شد، سرش را میان دستانش گرفت. چند نفر دورش جمع شدند. کسی دستش را روی شانه‌اش گذاشت:
  «گم شده؟ توی همین طبقه؟ چند سالشه؟»
  آنا سرش را بلند کرد. چشم‌هایش قرمز و وحشت‌زده بود. بغض کرد و فریاد زد:
  «به خدا بچه‌ی من نبود! اصلاً بچه‌ی من نبود!»
  آدم‌ها باهم پچ‌پچ کردند. کسی گفت: «بنده خدا قاطی کرده.»
  یکی دیگر پچ‌پچ کرد: «ولش کن، انگار حالش خوب نیست...»
  آنا دور خودش چرخید. نفسش به شماره افتاده بود. می‌خواست فرار کند. از این نگاه‌ها، از این فکرها، از این حقیقت که انگار داشت توی مغزش تغییر شکل می‌داد.
  «به من ربطی نداره، بفهمین! من نمی‌خواستم بیارمش بیرون! من بچه ندارم...!»
