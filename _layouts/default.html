<!doctype html>
<html lang="{{ page.lang | default: 'en' }}" dir="{% if page.lang == 'fa' %}rtl{% else %}ltr{% endif %}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600&family=Vazirmatn:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  {% seo %}
  {% feed_meta %}
</head>
<body class="lang-{{ page.lang | default: 'en' }}">
  {{ content }}
  <div class="wrap"><footer class="foot">{%- assign yr = 'now' | date: '%Y' -%}<span>© {% include num.html n=yr lang=page.lang %} {% if page.lang == 'fa' %}زهرا مهاجری{% else %}Zahra Mohajeri{% endif %}</span><a href="{{ '/feed.xml' | relative_url }}">RSS</a></footer></div>
  <script src="{{ '/assets/site.js' | relative_url }}"></script>
</body>
</html>
