---
layout: default
---
<article class="post{% if page.lang == 'fa' %} fa{% endif %}">
  <header>
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">{% include date.html date=page.date lang=page.lang %}</time>
  </header>
  <div class="content">
    {{ content }}
  </div>
  <p class="back">{% if page.lang == 'fa' %}<a href="{{ '/fa/' | relative_url }}">→ همه‌ی نوشته‌های فارسی</a>{% else %}<a href="{{ '/en/' | relative_url }}">← All English posts</a>{% endif %}</p>
</article>
